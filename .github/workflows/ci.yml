name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy
      - name: Lint (ruff)
        run: |
          . .venv/bin/activate
          ruff check .
      - name: Type check (mypy)
        run: |
          . .venv/bin/activate
          mypy src
      - name: Tests
        run: |
          . .venv/bin/activate
          pytest -q
